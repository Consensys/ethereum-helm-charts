name: Publish k8s-hooks Docker Image

on:
  workflow_dispatch:
    inputs:
      kubectl_version:
        description: "kubectl version to bake in (e.g. 1.36.0)"
        required: false
        default: "1.36.0"

env:
  IMAGE_NAME: consensys/ethereum-k8s-hooks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dockerhub    
    permissions:
      contents: read
      id-token: write # required for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/k8s-hooks
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KUBECTL_VERSION=${{ inputs.kubectl_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.kubectl_version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ inputs.kubectl_version }}@${DIGEST} \
            ${{ env.IMAGE_NAME }}:latest@${DIGEST}

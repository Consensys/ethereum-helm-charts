name: Publish k8s-hooks Docker Image

on:
  workflow_dispatch:
    inputs:
      kubectl_version:
        description: "kubectl version to bake in (e.g. 1.36.0)"
        required: false
        default: "1.36.0"

env:
  IMAGE_NAME: consensys/ethereum-k8s-hooks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dockerhub    
    permissions:
      contents: read
      id-token: write # required for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff9f9adf73d2ee3f40c # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730b07f7ce70f5571e3be793e25acfbf540849 # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: docker/k8s-hooks
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KUBECTL_VERSION=${{ inputs.kubectl_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.kubectl_version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ inputs.kubectl_version }}@${DIGEST} \
            ${{ env.IMAGE_NAME }}:latest@${DIGEST}

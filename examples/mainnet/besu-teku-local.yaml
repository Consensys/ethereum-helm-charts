---
global:
  provider: local
  env: dev
  network: mainnet
  elc: besu
  clc: teku

elc:
  image:
    elc:
      repository: hyperledger/besu
      tag: latest
  restore:
    enabled: false
    snapshot: ""
  storage:
    size: "5Gi"
  tolerations: []
  affinity: {}

clc:
  image:
    clc:
      repository: consensys/teku
      tag: latest
  restore:
    enabled: false
    snapshot: ""
  storage:
    size: "5Gi"
  tolerations: []
  affinity: {}

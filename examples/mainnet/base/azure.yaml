---
global:
  provider: azure
  env: dev
  network: mainnet
  snapshot:
    # sot (source of truth) node, ie this is what we will create snapshots of
    enabled: false
    # use the defaults of hourly, daily, weekly
    schedule: "@hourly"

elc:
  storage:
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    size: "1000Gi"
    parameters:
      skuName: Premium_LRS
  tolerations:
    - key: ethereum
      value: "true"
      effect: NoExecute
    - key: ethereum
      value: "true"
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              workloadType: ethereum
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workloadType
            operator: In
            values:
            - ethereum

clc:
  storage:
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    size: "250Gi"
    parameters:
      skuName: Premium_LRS
  tolerations:
    - key: ethereum
      value: "true"
      effect: NoExecute
    - key: ethereum
      value: "true"
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              workloadType: ethereum
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workloadType
            operator: In
            values:
            - ethereum

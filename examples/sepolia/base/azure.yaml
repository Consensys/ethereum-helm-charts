---
global:
  provider: azure
  env: dev
  network: sepolia
  snapshot:
    enabled: false
    schedule: "@hourly"

elc:
  storage:
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    size: "500Gi"
    parameters:
      skuName: Premium_LRS
  tolerations:
    - key: ethereum
      value: "true"
      effect: NoExecute
    - key: ethereum
      value: "true"
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              workloadType: ethereum
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workloadType
            operator: In
            values:
            - ethereum

clc:
  storage:
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    size: "100Gi"
    parameters:
      skuName: Premium_LRS
  tolerations:
    - key: ethereum
      value: "true"
      effect: NoExecute
    - key: ethereum
      value: "true"
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              workloadType: ethereum
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workloadType
            operator: In
            values:
            - ethereum

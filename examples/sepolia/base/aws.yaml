---
global:
  provider: aws
  env: dev
  network: sepolia
  snapshot:
    enabled: false
    schedule: "@hourly"

elc:
  storage:
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    size: "500Gi"
    parameters:
      type: gp3
      csi.storage.k8s.io/fstype: xfs
  tolerations:
    - key: ethereum
      value: "true"
      effect: NoExecute
    - key: ethereum
      value: "true"
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              workloadType: ethereum
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workloadType
            operator: In
            values:
            - ethereum
  service:
    monitor:
      podTargetLabels:
        - "ethereum/elc"
        - "ethereum/elc_version"
        - "ethereum/clc"
        - "ethereum/clc_version"
        - "ethereum/network"
        - "ethereum/owner"
        - "ethereum/env"
        - vpc

clc:
  storage:
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    size: "100Gi"
    parameters:
      type: gp3
      csi.storage.k8s.io/fstype: xfs
  tolerations:
    - key: ethereum
      value: "true"
      effect: NoExecute
    - key: ethereum
      value: "true"
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              workloadType: ethereum
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workloadType
            operator: In
            values:
            - ethereum

  service:
    monitor:
      podTargetLabels:
        - "ethereum/elc"
        - "ethereum/elc_version"
        - "ethereum/clc"
        - "ethereum/clc_version"
        - "ethereum/network"
        - "ethereum/owner"
        - "ethereum/env"
        - vpc

{{ if eq .Values.global.clc "nimbus" -}}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ethnode-clc.resourceName" . }}
  labels:
    {{- include "ethnode-clc.labels" . | nindent 4 }}
  namespace: {{ include "ethnode.namespace" . }}
spec:
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ethnode-clc.labels" . | nindent 6 }}
      app.kubernetes.io/component: "{{ .Values.global.clc }}"
  serviceName: {{ include "ethnode-clc.resourceName" . }}
  template:
    metadata:
      labels:
        {{- include "ethnode-clc.labels" . | nindent 8 }}
        app.kubernetes.io/component: "{{ .Values.global.clc }}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.settings.metrics.port | quote}}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "ethnode-clc.resourceName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.autoMount }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if or .Values.image.pullSecrets .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- include "ethnode-clc.imagePullSecrets" . | nindent 8 }}
      {{- end }}

      initContainers:
      - name: init
        image: {{ .Values.image.hooks.repository }}:{{ .Values.image.hooks.tag }}
        volumeMounts:
          - name: clc-pip
            mountPath: /pip
          - name: clc-data
            mountPath: {{ .Values.settings.dataPath }}
        securityContext:
          runAsUser: 0                        
        command:
        - /bin/bash
        - -xec
        - |
          # get the existing public ip to associate with
          PUBLIC_IP_TO_ASSOCIATE=$(curl --retry 5 --retry-delay 2 -sf ifconfig.io) || { echo "ERROR: failed to get public IP"; exit 1; }
          echo "PUBLIC_IP_TO_ASSOCIATE: $PUBLIC_IP_TO_ASSOCIATE"
          echo -ne "$PUBLIC_IP_TO_ASSOCIATE" > /pip/ip
          
          # update permissions on the data volume
          chown -R 1000:1000 {{ .Values.settings.dataPath }}

      containers:
      - name: nimbus
        image: {{ .Values.image.clc.repository }}:{{ .Values.image.clc.tag }}
        imagePullPolicy: {{ .Values.image.clc.imagePullPolicy }}
        resources:
          requests:
            cpu: "{{ .Values.resources.cpuRequest }}"
            memory: "{{ .Values.resources.memRequest }}"
          limits:
            cpu: "{{ .Values.resources.cpuLimit }}"
            memory: "{{ .Values.resources.memLimit }}"
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          {{- if or (eq .Values.global.provider "aws") (eq .Values.global.provider "azure") }}
          # just makes this easier to read locally
          - name: LOG4J_CONFIGURATION_FILE
            value: /etc/teku/log4j.xml
          {{- end }}
        volumeMounts:
          - name: clc-pip
            mountPath: /pip
            readOnly: true
          - name: clc-data
            mountPath: {{ .Values.settings.dataPath }}
          - name: clc-jwt
            mountPath: {{ .Values.global.jwt.secretPath }}
            readOnly: true            
        ports:
          - name: clc-rest
            containerPort: {{ .Values.settings.restApi.port }}
            protocol: TCP
          - name: clc-libp2p
            containerPort: {{ .Values.settings.p2p.port }}
            protocol: TCP
          - name: clc-discovery
            containerPort: {{ .Values.settings.p2p.port }}
            protocol: UDP
          - name: clc-metrics
            containerPort: {{ .Values.settings.metrics.port }}
            protocol: TCP
        command:
          - /bin/sh
          - -c
        args:
          - |
            pip=$(cat /pip/ip)

            # Run trustedNodeSync on first start only — beacon/ subdir is created by it
            if [ ! -d "{{ .Values.settings.dataPath }}/beacon" ]; then
              echo "No existing beacon data, running trustedNodeSync from {{ if eq .Values.global.network "mainnet" }}{{ .Values.settings.checkpointSync.mainnetUrl }}{{ else }}{{ .Values.settings.checkpointSync.testnetBaseUrl }}.{{ .Values.global.network }}.{{ .Values.settings.checkpointSync.testnetDomain }}{{ end }}"
              /home/user/nimbus-eth2/build/nimbus_beacon_node trustedNodeSync \
                --network={{ .Values.global.network }} \
                --data-dir={{ .Values.settings.dataPath | quote }} \
                --trusted-node-url="{{ if eq .Values.global.network "mainnet" }}{{ .Values.settings.checkpointSync.mainnetUrl }}{{ else }}{{ .Values.settings.checkpointSync.testnetBaseUrl }}.{{ .Values.global.network }}.{{ .Values.settings.checkpointSync.testnetDomain }}{{ end }}" \
                --backfill=false \
                --non-interactive
            fi

            exec /home/user/nimbus-eth2/build/nimbus_beacon_node \
              --network={{ .Values.global.network }} \
              --data-dir={{ .Values.settings.dataPath | quote }} \
              --log-level={{ lower .Values.settings.logging | quote }} \
              --log-format=json \
              --non-interactive \
              --status-bar=false \
              --doppelganger-detection \
              --validator-monitor-auto \
              --suggested-fee-recipient="0x0000000000000000000000000000000000000000" \
              --web3-url="http://{{ include "ethnode-elc.resourceName" . }}.{{ include "ethnode.namespace" . }}.svc.cluster.local:8551" \
              --jwt-secret="{{ .Values.global.jwt.secretPath }}/jwtSecret.hex" \
              --enr-auto-update=false \
              --tcp-port={{ .Values.settings.p2p.port }} \
              --udp-port={{ .Values.settings.p2p.port }} \
              --nat=extip:${pip} \
              --rest \
              --rest-address={{ .Values.settings.restApi.host | quote }} \
              --rest-port={{ .Values.settings.restApi.port }} \
              --rest-allow-origin={{ join "," .Values.settings.restApi.corsOrigins }} \
              --metrics \
              --metrics-address={{ .Values.settings.metrics.host | quote }} \
              --metrics-port={{ .Values.settings.metrics.port }}

     
      volumes:
      - name: clc-jwt
        secret:
          secretName: {{ include "ethnode.resourceName" . }}-jwt         
      - name: clc-pip
        emptyDir: {}
      - name: clc-data
        persistentVolumeClaim:
          claimName: {{ include "ethnode-clc.resourceName" . }}-pvc

{{- end }}


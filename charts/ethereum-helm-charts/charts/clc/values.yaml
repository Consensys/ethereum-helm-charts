fullnameOverride: ""
clc: default
provider: local
network: test
env: test
snapshot:
  # sot (source of truth) node, ie this is what we will create snapshots of
  sot: false
  # use the defaults of @hourly, @daily, @weekly
  schedule: "@weekly"
restore:
  enabled: false
  # restore from a particular volumesnapshot
  snapshot: ""
  
extraLabels: {}
annotations: {}
affinity: {}
nodeSelector: {}
tolerations: []
securityContext: {}

serviceAccount:
  create: true
  labels: {}
  name:
  annotations: {}
  autoMount: true

service:
  annotations: {}
  labels: {}
  type: ClusterIP
  ports:
    - name: clc-libp2p
      port: 9000
      targetPort: clc-libp2p
      protocol: TCP
    - name: clc-discovery
      port: 9000
      targetPort: clc-discovery
      protocol: UDP
    - name: clc-rest
      port: 5051
      targetPort: clc-rest
      protocol: TCP
    - name: clc-metrics
      port: 8008
      targetPort: clc-metrics
      protocol: TCP
 # Configure pods labels that need to be added as Prometheus labels
 # monitor:
 #   podTargetLabels: []

resources:
  cpuLimit: 4
  cpuRequest: 2
  memLimit: "16G"
  memRequest: "8G"

image:
  clc:
    repository: none/none
    tag: latest
    imagePullPolicy: Always
  hooks:
    repository: ubuntu
    tag: 24.04
    imagePullPolicy: Always

storage:
  allowVolumeExpansion: true
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Delete
  size: "250Gi"
  parameters: {}
  ## for azure https://learn.microsoft.com/en-us/azure/aks/azure-csi-disk-storage-provision
  # parameters:
  #   skuName: Premium_LRS
  #   shareAccessTier: TransactionOptimized
  #   protocol: nfs
  ## for AWS https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/docs/parameters.md
  # parameters:
  #   type: gp3
  #   allowAutoIOPSPerGBIncrease: true
  #   csi.storage.k8s.io/fstype: xfs
  
jwt:
  secretPath: "/jwt"
  hostAllowlist: ["*"]

settings:
  dataStorageMode: "minimal"
  dataPath: "/data"
  keysPath: "/tmp/key"
  logging: INFO
  env_opts: ""
  p2p:
    enabled: true
    interface: "0.0.0.0"
    port: 9000
    advertisedPort: 9000
    discovery: true
  restApi:
    enabled: true
    docsEnabled: false
    host: "0.0.0.0"
    port: 5051
    corsOrigins: ["*"]
    allowlist: ["*"]
    api: ["beacon","config","debug","events","node","validator","lightclient"]
  metrics:
    enabled: true
    host: "0.0.0.0"
    port: 8008
    allowlist: ["*"]
  checkpointSync:
    enabled: true
    mainnetUrl: "https://sync-mainnet.beaconcha.in"
    testnetBaseUrl: "https://checkpoint-sync"
    testnetDomain: "ethpandaops.io"
    statePath: "/eth/v2/debug/beacon/states/finalized"

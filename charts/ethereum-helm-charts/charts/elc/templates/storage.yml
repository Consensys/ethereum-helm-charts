{{- if or (eq .Values.global.provider "aws") (eq .Values.global.provider "azure") }}

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "ethnode-elc.resourceName" . }}-storage
  labels:
    {{- include "ethnode-elc.labels" . | nindent 4 }}  
  namespace: {{ include "ethnode.namespace" . }}
volumeBindingMode: {{ .Values.storage.volumeBindingMode }}
reclaimPolicy: {{ .Values.storage.reclaimPolicy }}
{{- if eq .Values.global.provider "aws" }}
allowVolumeExpansion: {{ .Values.storage.allowVolumeExpansion }}
provisioner:  ebs.csi.aws.com
parameters:
  {{- with .Values.storage.parameters }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq .Values.global.provider "azure" }}
allowVolumeExpansion: {{ .Values.storage.allowVolumeExpansion }}
provisioner: disk.csi.azure.com
parameters:
  {{- with .Values.storage.parameters }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

{{- else if eq .Values.global.provider "local" }}

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "ethnode-elc.resourceName" . }}-storage
  labels:
    type: local
spec:
  storageClassName: ""
  persistentVolumeReclaimPolicy: Delete  
  capacity:
    storage: {{ .Values.storage.size | quote }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/{{ include "ethnode-elc.resourceName" . }}-storage"

{{- end }}


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ethnode-elc.resourceName" . }}-pvc
  labels:
    name: {{ include "ethnode-elc.resourceName" . }}
    {{- if or (eq .Values.global.provider "aws") (eq .Values.global.provider "azure") }}
    {{ if .Values.global.snapshot.enabled -}}
    "schedule/{{ .Values.global.snapshot.schedule | replace "@" ""}}": "enabled"
    {{- end }}
    {{- include "ethnode-elc.labels" . | nindent 4 }}  
    {{- end }}
  namespace: {{ include "ethnode.namespace" . }}
spec: 
  accessModes:
    - ReadWriteOnce
  {{- if or (eq .Values.global.provider "aws") (eq .Values.global.provider "azure") }}  
  storageClassName: {{ include "ethnode-elc.resourceName" . }}-storage
  {{- else if eq .Values.global.provider "local" }}
  storageClassName: ""
  volumeName: {{ include "ethnode-elc.resourceName" . }}-storage
  {{- end }}
  resources: 
    requests:
      storage: {{ .Values.storage.size | quote }}
  {{- if or (eq .Values.global.provider "aws") (eq .Values.global.provider "azure") -}}
  {{- if .Values.restore.enabled -}}
  dataSource:
    name: {{ .Values.restore.snapshot }}
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  {{- end }}
  {{- end }}



{{- if or (eq .Values.global.provider "aws") (eq .Values.global.provider "azure") }}

{{ if .Values.global.snapshot.enabled  -}}

---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ include "ethnode-elc.resourceName" . }}-vsc
  labels:
    {{- include "ethnode-elc.labels" . | nindent 4 }}  
  namespace: {{ include "ethnode.namespace" . }}
deletionPolicy: Delete
{{- if eq .Values.global.provider "aws" }}
driver: ebs.csi.aws.com
parameters:
  tagSpecification_1: "name={{ include "ethnode-elc.resourceName" . }}"
  tagSpecification_2: "network={{ .Values.global.network }}"
  tagSpecification_3: "elc=besu"
  tagSpecification_4: "data-storage-format={{ .Values.settings.dataStorageFormat }}"
  tagSpecification_5: "sync-mode={{ .Values.settings.syncMode }}"  
{{- else if eq .Values.global.provider "azure" }}
driver: disk.csi.azure.com
{{- end }}  

---
apiVersion: snapscheduler.backube/v1
kind: SnapshotSchedule
metadata:
  name:  {{ include "ethnode-elc.resourceName" . }}-vss
  namespace: {{ include "ethnode.namespace" . }}
spec:
  claimSelector:
    matchLabels:
      name: {{ include "ethnode-elc.resourceName" . }}
      "schedule/{{ .Values.global.snapshot.schedule | replace "@" ""}}": "enabled"
      {{- include "ethnode-elc.labels" . | nindent 6 }}      
  schedule: "{{ .Values.global.snapshot.schedule }}"
  retention:
    # retained specified in hours. (168h = 1 week)
    expires: "168h"
    maxCount: 10  # optional
  # set of labels can be added to each VolumeSnapshot object
  snapshotTemplate:
    labels:  
      name: {{ include "ethnode-elc.resourceName" . }}
      {{- include "ethnode-elc.labels" . | nindent 6 }}  
    snapshotClassName: {{ include "ethnode-elc.resourceName" . }}-vsc


{{- end }}

{{- end }}
